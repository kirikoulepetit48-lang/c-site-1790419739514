<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JORA - Prédiction Avenir</title>
<style>
body{margin:0;background:#0a0a0a;color:#fff;font-family:Arial;overflow-x:hidden}
.hero{background:radial-gradient(circle at top,#6a00ff,#000);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:15px}
.card{background:rgba(255,255,255,0.07);backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,0.2);padding:30px;border-radius:30px;max-width:400px;width:100%;text-align:center;box-shadow:0 0 60px #6a00ff55}
input{width:85%;padding:18px;border-radius:50px;border:none;background:#fff;color:#000;text-align:center;font-size:18px;font-weight:bold;outline:none;margin:15px 0}
button{width:90%;padding:18px;border:none;border-radius:50px;background:linear-gradient(90deg,#ff00cc,#6a00ff);color:#fff;font-weight:bold;font-size:18px;cursor:pointer;box-shadow:0 10px 30px #ff00cc55}
.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:#fff;color:#000;padding:12px 20px;border-radius:50px;font-weight:bold;box-shadow:0 10px 30px rgba(0,0,0,0.5);display:none;z-index:999;animation:pop 0.3s}
@keyframes pop{0%{transform:translateX(-50%) scale(0)}100%{transform:translateX(-50%) scale(1)}}
.pred{margin-top:20px;text-align:left;background:rgba(255,255,255,0.08);padding:16px;border-radius:18px;border-left:4px solid #ff00cc;margin-bottom:10px;opacity:0;transform:translateY(20px);animation:show 0.5s forwards}
@keyframes show{to{opacity:1;transform:translateY(0)}}
</style>
</head>
<body>
<div class="toast" id="toast">🔮 Connexion à ton avenir...</div>

<div class="hero">
<div class="card">
<h1 style="font-size:32px;margin:0">🔮 JORA VOIT TON AVENIR</h1>
<p style="color:#aaa">Tape seulement ton prénom. Je vois tout.</p>
<input id="nom" placeholder="Ton prénom">
<button onclick="predire()">VOIR MON AVENIR ✨</button>
<div id="res"></div>
</div>
</div>

<script>
function showToast(txt){
let t=document.getElementById('toast');
t.innerText=txt; t.style.display='block';
setTimeout(()=>t.style.display='none',2000);
}

function predire(){
let nom=document.getElementById('nom').value.trim();
if(!nom)return alert('Tape ton prénom !');
let res=document.getElementById('res');
res.innerHTML='';
showToast('🔮 Lecture de '+nom+'...');

setTimeout(()=>{showToast('📡 Connexion au futur...')},1000);
setTimeout(()=>{showToast('✨ Avenir trouvé !')},2000);

setTimeout(()=>{
let base=nom.split('').reduce((a,b)=>a+b.charCodeAt(0),0);
let metiers=["Grand Entrepreneur à Dubaï","Star TikTok avec 2M abonnés","Boss de la musique","Propriétaire de 5 maisons","Trader millionnaire","Influenceur international"];
let amours=["Tu vas te marier à 26 ans avec une très belle femme","Une fille qui t'aime en secret va t'avouer bientôt","Tu auras 3 enfants magnifiques","Ton âme soeur habite à l'étranger"];
let argents=["15 Millions $","50 Millions $","Tu seras riche à 24 ans","Tu auras plus d'argent que tes parents"];
let villes=["Dubaï","Paris","USA","Canada","Lubumbashi sera petite pour toi"];

let m=metiers[base%metiers.length];
let a=amours[base%amours.length];
let ar=argents[base%argents.length];
let v=villes[base%villes.length];

res.innerHTML=`
<div class=pred style=animation-delay:0.1s>👤 <b>${nom}, voici ton futur :</b></div>
<div class=pred style=animation-delay:0.3s>💼 <b>Travail :</b> ${m}</div>
<div class=pred style=animation-delay:0.5s>❤️ <b>Amour :</b> ${a}</div>
<div class=pred style=animation-delay:0.7s>💰 <b>Argent :</b> ${ar}</div>
<div class=pred style=animation-delay:0.9s>🌍 <b>Ville de gloire :</b> ${v}</div>
<div class=pred style=animation-delay:1.1s; border-color:#00ff88>🔥 <b>Message de JORA :</b> N'abandonne pas, ton heure arrive en 2027 !</div>
<br>
<button style=background:#25D366 onclick=share()>📲 Partager ma prédiction</button>
`;

window.txt=`🔮 PREDICTION JORA POUR ${nom}\n\n💼 ${m}\n❤️ ${a}\n💰 ${ar}\n🌍 Ville: ${v}\n\nDécouvre ton avenir ici: https://kirikoulepetit48-lang.github.io/Prediction.html`;
},3000);
}
function share(){
window.open('https://wa.me/?text='+encodeURIComponent(window.txt),'_blank');
}
</script>
</body>
</html>
